<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basic Science QBank</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#151922;--mut:#6b7380;--bd:#e6e8ee;--pri:#2563eb;--priT:#fff;--pri2:#3b82f6;--ok:#16a34a;--okB:#e7f6ec;--no:#dc2626;--noB:#fdecec;--warn:#b45309;--warnB:#fef3c7;
  --shadow:0 1px 2px rgba(20,24,34,.04),0 4px 14px rgba(20,24,34,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0c0e13;--card:#161a22;--tx:#e9ebf1;--mut:#8b94a3;--bd:#252b36;--pri:#3b82f6;--pri2:#60a5fa;--ok:#34d399;--okB:#10281f;--no:#f87171;--noB:#2c1517;--warn:#fbbf24;--warnB:#2b2410;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:-.01em}
#app{max-width:720px;margin:0 auto;padding:14px 14px calc(80px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:21px;margin:2px 0 14px;font-weight:800;letter-spacing:-.02em}h2{font-size:14px;margin:20px 2px 10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:12px;cursor:pointer;transition:transform .1s,background .15s}
button.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--priT);border-color:transparent;font-weight:700;box-shadow:0 3px 10px rgba(37,99,235,.28)}
button.g{background:none;border-color:transparent;color:var(--pri);padding:6px 8px}
button:disabled{opacity:.45}
button:active{transform:scale(.97)}
.chip{display:inline-block;padding:7px 12px;border:1px solid var(--bd);border-radius:999px;margin:0 6px 6px 0;background:var(--card);cursor:pointer;font-size:13px;user-select:none;transition:background .15s,border-color .15s,color .15s}
.chip:active{transform:scale(.97)}
.chapter{border-bottom:1px solid var(--bd)}
.chapter:last-child{border-bottom:0}
.chaprow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:13px 4px;text-align:left;cursor:pointer;color:var(--tx)}
.chev{display:inline-block;transition:transform .18s;color:var(--mut);font-size:13px;flex:none;width:14px}
.chev.open{transform:rotate(90deg);color:var(--pri)}
.subwrap{padding:2px 4px 14px 30px;animation:slide .15s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.trow.sub{padding:9px 11px;margin-bottom:5px;border-radius:10px;background:var(--bg)}
.bar.thin{height:4px;margin-top:5px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.trow{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:8px;border-radius:10px}
.grpdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;flex:none}
.grphead{display:flex;align-items:center;gap:8px;padding:14px 2px 4px;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5;backdrop-filter:blur(8px)}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 0;font-size:11px;color:var(--mut);font-weight:600}
nav button.on{color:var(--pri);font-weight:700}nav button span{display:block;font-size:19px;margin-bottom:1px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:12px 13px;align-items:flex-start;border-radius:12px}
.opt .l{font-weight:700;min-width:18px}
.opt.ok{background:var(--okB);border-color:var(--ok)}.opt.no{background:var(--noB);border-color:var(--no)}
.q{font-size:16px;margin:8px 0 12px;white-space:pre-wrap}

.ex{border-left:3px solid var(--pri);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}
.warn{background:var(--warnB);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.msg{padding:9px 12px;border-radius:12px;margin:8px 0;max-width:92%;overflow-wrap:anywhere}
.msg.u{background:var(--pri);color:#fff;margin-left:auto;white-space:pre-wrap}.msg.a{background:var(--card);border:1px solid var(--bd)}
.msg p{margin:4px 0}.msg ul,.msg ol{margin:4px 0;padding-left:20px}.msg code{background:var(--bg);padding:1px 4px;border-radius:4px}
.msg table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}.msg td,.msg th{border:1px solid var(--bd);padding:3px 6px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
textarea{resize:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.qbar{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:3}
.strip{display:flex;gap:4px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.dot{flex:none;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:6px;background:var(--bd);font-size:11px;font-style:normal;cursor:pointer;color:var(--tx)}
.dot.ok{background:var(--ok);color:#fff}.dot.no{background:var(--no);color:#fff}.dot.n{background:var(--warn);color:#fff}.dot.cur{outline:2px solid var(--pri);outline-offset:1px}
.navr{display:flex;gap:8px;margin-top:8px;align-items:center}.navr .arr{width:52px;font-size:18px;padding:10px 0}
#side{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .2s;z-index:8;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#side.open{transform:none}
#side header{padding:10px 12px;border-bottom:1px solid var(--bd)}
#sbody{flex:1;overflow-y:auto;padding:10px 12px}
#sfoot{padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);display:none}
#side.chat #sfoot{display:block}
@media(min-width:1100px){body.sopen #app{margin-left:max(0px,calc((100vw - 1140px)/2));margin-right:auto}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<aside id="side"><header><div class="row sp"><b>🤖 Ask AI</b><button class="g" onclick="toggleSide()">✕</button></div>
<div class="xs mut" id="sq" style="margin:2px 0 6px"></div>
<div class="row"><span class="chip" id="t-note" onclick="sideTab='note';renderSide()">📌 Note</span><span class="chip" id="t-chat" onclick="sideTab='chat';renderSide()">💬 Chat</span></div></header>
<div id="sbody"></div>
<div id="sfoot"><div class="row"><textarea id="si" rows="2" placeholder="Ask about this question…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendQ()}"></textarea><button class="p" onclick="sendQ()">Send</button></div></div></aside>

const KEY='bsqb_v1',DEF_MODEL='gemini-3.5-flash-lite';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BY={};DATA.forEach(q=>BY[q.id]=q);
const TOPICS=[...new Set(DATA.map(q=>q.topic))].sort();
// Updated for Basic Science
const SYSORDER=["Anatomy","Embryology","Histology","Physiology","Biochemistry","Pathology","Pharmacology","Microbiology","Immunology"];
const PAL=['#0ea5e9','#ef4444','#f97316','#eab308','#a855f7','#ec4899','#14b8a6','#3b82f6','#e11d48','#22c55e','#8b5cf6','#f59e0b','#06b6d4','#64748b'];
const gc=ch=>{const i=SYSORDER.indexOf(ch);return i<0?'var(--mut)':PAL[i%PAL.length]};
const CHAPTERS=(()=>{
  const m={};
  DATA.forEach(q=>{(m[q.chapter]||(m[q.chapter]=new Set())).add(q.topic)});
  const order=[...new Set(DATA.map(q=>q.chapter))];
  const cnt={};DATA.forEach(q=>cnt[q.chapter]=(cnt[q.chapter]||0)+1);
  order.sort((a,b)=>{const ia=SYSORDER.indexOf(a),ib=SYSORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)});
  return order.map(ch=>({chapter:ch,topics:[...m[ch]].sort(),count:cnt[ch]}));
})();
const A=q=>q.ans||((S.keys&&S.keys[q.id])?S.keys[q.id].ans:null)||null;
const WHY=q=>q.why||((S.keys&&S.keys[q.id])?S.keys[q.id].why:'')||'';
const FA=q=>q.freeAns||((S.keys&&S.keys[q.id])?S.keys[q.id].free:'')||'';
const graded=q=>!!A(q);
const isRecall=q=>!q.opts||q.opts.length<2;
const def=()=>({v:1,a:{},log:[],sess:[],bm:[],cur:null,chat:[],ctx:null,notes:{},qc:{},manualDup:[],keys:{},set:{key:'',model:DEF_MODEL,ahead:3,peek:false}});
let S=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY));if(r)return Object.assign(def(),r)}catch(e){}return def()})();
S.set=Object.assign({key:'',model:DEF_MODEL,ahead:3,peek:false},S.set);
let store=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(store){store=false;toast('Storage blocked — use Export in More')}}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
let sideOpen=false,sideTab='note',qbusy=null,openCh=new Set();
let tab='home',setup={topics:[],filter:'all',count:20,shuffle:true,hideDup:true,src:''},busy=false;
const day=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pct=(a,b)=>b?Math.round(100*a/b):0;

/* ---------- stats ---------- */
function topicStats(){
  const o={};TOPICS.forEach(t=>o[t]={t,total:0,seen:0,att:0,cor:0,mast:0});
  DATA.forEach(q=>{if(q.flag)return;const s=o[q.topic],r=S.a[q.id];s.total++;if(r){s.seen++;s.att+=r.n;s.cor+=r.c;if(r.l)s.mast++}});
  return o;
}
function overall(){const T=Object.values(topicStats());const z=k=>T.reduce((a,x)=>a+x[k],0);return{total:z('total'),seen:z('seen'),att:z('att'),cor:z('cor'),mast:z('mast')}}
function streak(){const ds=new Set(S.log.map(l=>day(l[0])));let n=0,d=new Date();if(!ds.has(day(d)))d.setDate(d.getDate()-1);while(ds.has(day(d))){n++;d.setDate(d.getDate()-1)}return n}
function pool(tp,filter,hideDup){
  return DATA.filter(q=>{
    if(tp.length&&!tp.includes(q.topic))return false;
    if(hideDup&&filter!=='dup'&&(!q.canonical||S.manualDup.includes(q.id)))return false;
    const r=S.a[q.id];
    if(setup.src&&!(q.sources||[]).includes(setup.src))return false;
    if(filter==='recall')return isRecall(q);
    if(filter==='mcq')return !isRecall(q);
    if(filter==='keyed')return !isRecall(q)&&!!A(q);
    if(filter==='nokey')return !isRecall(q)&&!A(q);
    if(filter==='dup')return q.dupCount>1||S.manualDup.includes(q.id);
    if(filter==='unseen')return !r;
    if(filter==='missed')return r&&!r.l;
    if(filter==='bm')return S.bm.includes(q.id);
    return true;
  });
}

const TABS=[['home','🏠','Home'],['practice','📝','Practice'],['progress','📈','Progress'],['tutor','🤖','Tutor'],['more','⚙️','More']];

function render(){
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
  ({home:vHome,practice:vPractice,progress:vProgress,tutor:vTutor,more:vMore})[tab]();
  renderSide();
}

  let h=`<h1>Basic Science Exit Exam QBank</h1><div class="grid">

  <div class="stat"><b>${streak()}🔥</b><span class="xs mut">day streak</span></div></div>`;
  if(S.cur&&!S.cur.done)h+=`<div class="card row sp" style="margin-top:10px"><div><div class="b">Resume session</div><div class="sm mut">${esc(S.cur.label)} · ${S.cur.i+1}/${S.cur.ids.length}</div></div><button class="p" onclick="go('practice')">Resume</button></div>`;
  h+=`<h2>Subjects</h2><div class="card" style="padding:2px 10px">`;
  h+=CHAPTERS.map(({chapter,topics,count})=>{
    const seen=topics.reduce((a,t)=>a+TS[t].seen,0), mast=topics.reduce((a,t)=>a+TS[t].mast,0);
    const att=topics.reduce((a,t)=>a+TS[t].att,0), cor=topics.reduce((a,t)=>a+TS[t].cor,0);
    const open=openCh.has(chapter);
    const rows=topics.map(t=>{const x=TS[t];return `<button class="trow sub" onclick="quick('${esc(t).replace(/'/g,"\\'")}')"><div class="row sp"><span class="sm">${esc(t)}</span><span class="xs mut">${x.mast}/${x.total} · ${pct(x.cor,x.att)}%</span></div><div class="bar thin"><i style="width:${pct(x.mast,x.total)}%;background:${gc(chapter)}"></i></div></button>`}).join('');
    return `<div class="chapter">
      <button class="chaprow" onclick="toggleCh('${esc(chapter).replace(/'/g,"\\'")}')">
        <span class="chev ${open?'open':''}" style="${open?`color:${gc(chapter)}`:''}">▸</span>
        <span class="grpdot" style="background:${gc(chapter)}"></span>
        <span class="grow"><div class="b">${esc(chapter)}</div><div class="xs mut">${count} questions · ${mast}/${count} mastered · ${pct(cor,att)}% accuracy</div></span>
      </button>
      <div class="bar" style="margin:0 14px 10px"><i style="width:${pct(mast,count)}%;background:${gc(chapter)}"></i></div>
      ${open?`<div class="subwrap">${rows}<button class="trow sub b" style="color:${gc(chapter)}" onclick="quickChapter('${esc(chapter).replace(/'/g,"\\'")}')">Practice all of this subject →</button></div>`:''}
    </div>`;
  }).join('');
  h+=`</div>`;
  $('#app').innerHTML=h;
}
function toggleCh(ch){openCh.has(ch)?openCh.delete(ch):openCh.add(ch);render()}
function quick(t){setup.topics=[t];setup.chapters=[];tab='practice';S.cur=null;render()}
function quickChapter(ch){const c=CHAPTERS.find(x=>x.chapter===ch);setup.topics=[...c.topics];tab='practice';S.cur=null;render()}

    const seen=S.cur.res[q.id]!==undefined||S.set.peek;
    if(!S.set.key)h='<div class="warn">Add your Gemini API key in More → Settings.</div>';
    else if(!seen)h=`<div class="mut sm">🔒 ${S.notes[q.id]?'Note ready':'Note is being prepared in the background'} — answer the question to reveal it (or enable “peek” in Settings).</div>`;
    else h=`<div class="msg a" style="max-width:100%">${noteHTML(q.id)}</div>`;
    if(S.set.key)h+=`<div class="row" style="margin-top:10px"><button class="grow xs" onclick="prepAll()">Prepare whole session</button></div><div class="xs mut" style="margin-top:6px">${S.cur.ids.filter(id=>S.notes[id]).length}/${S.cur.ids.length} notes ready${perr?' · '+esc(perr):''}</div>`;
    b.innerHTML=h;
  }else{
    const m=S.qc[q.id]||[];
    h=m.map(x=>`<div class="msg ${x.r==='u'?'u':'a'}">${x.r==='u'?esc(x.t):md(x.t)}</div>`).join('')+(qbusy===q.id?'<div class="msg a mut">…</div>':'');
    h+=`<div style="margin-top:8px">${['Explain simply','Mnemonic','Why not the others?','Related exam pearls'].map(x=>`<span class="chip" onclick="sendQ('${x}')">${x}</span>`).join('')}${m.length?`<span class="chip" onclick="S.qc['${q.id}']=[];save();renderSide()">Clear</span>`:''}</div>`;
    b.innerHTML=h;b.scrollTop=b.scrollHeight;
  }
}
async function sendQ(text){
  const q=curQ();if(!q||qbusy)return;
  const ta=$('#si');text=(text||ta.value).trim();if(!text)return;
  if(!S.set.key){toast('Add API key in More');return}
  ta.value='';sideTab='chat';
  const id=q.id,h=S.qc[id]||(S.qc[id]=[]);h.push({r:'u',t:text});if(h.length>30)h.splice(0,h.length-30);qbusy=id;save();renderSide();
  const ans=S.cur.res[id]!==undefined;
  const sys=SYS+'\n\nCurrent question:\n'+qctx(id)+(S.notes[id]?'\n\nPrepared note:\n'+S.notes[id].t:'')+`\n\nStudent has answered: ${ans?'yes':'no — give hints only, do not reveal the answer unless asked directly'}.`;
  try{h.push({r:'a',t:await gem(toContents(h.slice(-12)),sys)})}catch(e){h.push({r:'a',t:'⚠ '+e.message})}
  qbusy=null;save();renderSide();
}

/* ---------- background presolve ---------- */
const KSYS=`You are a senior medical science educator writing an answer key for a basic science exit exam. Be accurate and concise.`;
const PNOTE=`Write the important note on this topic that lets the student solve this question. Format exactly:\n**Answer:** letter + one-line reason\n**Key concept:** 3-5 terse bullets (high-yield facts)\n**Traps:** one line on why the tempting distractors fail\n**Mnemonic:** only if a good one exists\nMax 150 words.`;
const PQ=[],PIN=new Set(),PR={};let prun=false,pwait=0,perr='';
function enq(id,front){if(!S.set.key||S.notes[id]||PIN.has(id)||PQ.includes(id))return;front?PQ.unshift(id):PQ.push(id);perr='';updateNoteUI();pump()}
function presolveAhead(){
  const n=+S.set.ahead||0,c=S.cur;if(!n||!S.set.key||!c||c.done)return;
  for(let k=n;k>=0;k--){const id=c.ids[c.i+k];if(id)enq(id,true)}
}
function prepAll(){const c=S.cur;let k=0;c.ids.forEach(id=>{if(!S.notes[id]&&!PQ.includes(id)&&!PIN.has(id)){PQ.push(id);k++}});toast(k+' queued');pump();updateNoteUI()}
function regen(id){delete S.notes[id];save();enq(id,true)}
async function pump(){
  if(prun)return;prun=true;
  while(PQ.length){
    if(Date.now()<pwait)await sleep(pwait-Date.now());
    const id=PQ.shift();if(S.notes[id])continue;
    PIN.add(id);updateNoteUI();
    try{const qq=BY[id];if(qq){if(isRecall(qq))await resolveFree(id);else await resolveKey(id)}}catch(e){}
    try{const t=await gem([{role:'user',parts:[{text:qctx(id)+'\n\n'+PNOTE}]}],KSYS);S.notes[id]={t,ts:Date.now()};perr='';save()}
    catch(e){
      PR[id]=(PR[id]||0)+1;
      if((e.status===429||e.status>=500)&&PR[id]<4){PQ.unshift(id);pwait=Date.now()+20000;perr='Rate limited — retrying…'}
      else{perr=e.message;if(e.status===400||e.status===403||e.status===401)PQ.length=0}
    }
    PIN.delete(id);updateNoteUI();await sleep(1800);
  }
  prun=false;
}
function jparse(t){const m=String(t).replace(/```json|```/g,'').match(/\{[\s\S]*\}/);return JSON.parse(m?m[0]:t)}
async function resolveKey(id){
  const q=BY[id];if(!q||isRecall(q)||A(q)||!S.set.key||KPEND.has(id))return;
  KPEND.add(id);
  try{
    const t=await gem([{role:'user',parts:[{text:`Question (${q.chapter} > ${q.topic}):\n${q.q}\n${q.opts.map(o=>o[0]+'. '+o[1]).join('\n')}\n\nReturn ONLY JSON: {"answer":"<single option letter>","why":"<2-3 sentence explanation of why it is correct, then one sentence on why the strongest distractor is wrong>"}. If the item is flawed or ambiguous, still pick the best-supported letter and say so in "why".`}]}],KSYS,true);
    const j=jparse(t),L=String(j.answer||'').trim().toUpperCase()[0];
    if(q.opts.some(o=>o[0]===L)){S.keys[id]={ans:L,why:String(j.why||''),ts:Date.now()};save();kerr=''}
  }catch(e){kerr=e.message}
  KPEND.delete(id);
}
async function resolveFree(id){
  const q=BY[id];if(!q||!isRecall(q)||FA(q)||!S.set.key||KPEND.has(id))return;
  KPEND.add(id);
  try{
    const t=await gem([{role:'user',parts:[{text:`Exam question (${q.chapter} > ${q.topic}):\n${q.q}\n\nReturn ONLY JSON: {"answer":"<direct model answer, 1-3 lines>","why":"<2-4 sentences: key reasoning / high-yield facts>"}.`}]}],KSYS,true);
    const j=jparse(t);
    S.keys[id]={free:String(j.answer||'').trim(),why:String(j.why||''),ts:Date.now()};save();kerr=''
  }catch(e){kerr=e.message}
  KPEND.delete(id);
}
function noteHTML(id){
  const n=S.notes[id];
  if(n)return md(n.t)+`<button class="g xs" onclick="regen('${id}')">↻ Regenerate</button>`;
  if(!S.set.key)return '<div class="mut sm">Add API key in More to enable notes.</div>';
  if(PIN.has(id)||PQ.includes(id))return '<div class="mut sm">⏳ Preparing note…</div>';
  return `<div class="sm mut">${esc(perr||'Not prepared yet.')}</div><button class="g" onclick="enq('${id}',true)">Generate now</button>`;
}
function updateNoteUI(){
  const q=curQ();if(!q)return;
  const nb=$('#nb');if(nb)nb.innerHTML=noteHTML(q.id);
  if(sideOpen&&sideTab==='note')renderSide();
}

function md(s){
  let t=esc(s).replace(/```[\s\S]*?```/g,m=>'<pre style="overflow-x:auto">'+m.replace(/```\w*\n?/g,'')+'</pre>');
  const L=t.split('\n'),o=[];let list=null,tbl=false;
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
  const close=()=>{if(list){o.push('</'+list+'>');list=null}if(tbl){o.push('</table>');tbl=false}};
  for(const ln of L){
    let m;
    if(m=ln.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){close();o.push('<ul>');list='ul'}o.push('<li>'+inl(m[1])+'</li>')}
    else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){close();o.push('<ol>');list='ol'}o.push('<li>'+inl(m[1])+'</li>')}
    else if(/^\s*\|.*\|\s*$/.test(ln)){if(/^[\s|:-]+$/.test(ln))continue;if(!tbl){close();o.push('<table>');tbl=true}o.push('<tr>'+ln.trim().slice(1,-1).split('|').map(c=>'<td>'+inl(c.trim())+'</td>').join('')+'</tr>')}
    else if(m=ln.match(/^#+\s+(.*)/)){close();o.push('<p><b>'+inl(m[1])+'</b></p>')}
    else if(ln.trim()===''){close()}
    else{close();o.push('<p>'+inl(ln)+'</p>')}
  }
  close();return o.join('');
}

/* ---------- more ---------- */
function vMore(){
  $('#app').innerHTML=`<h1>More</h1>
  <div class="card"><div class="b" style="margin-bottom:6px">Gemini settings</div>
   <label class="xs mut">API key (stored only in this browser)</label><input id="k" type="password" value="${esc(S.set.key)}" placeholder="AIza…" autocomplete="off">
   <label class="xs mut" style="display:block;margin-top:8px">Model</label><input id="m" value="${esc(S.set.model)}">
   <label class="xs mut" style="display:block;margin-top:8px">Background presolve (AI note prepared for upcoming questions)</label>
   <select id="ah">${[[0,'Off'],[1,'Next 1'],[3,'Next 3'],[5,'Next 5'],[10,'Next 10']].map(([v,l])=>`<option value="${v}" ${+S.set.ahead===v?'selected':''}>${l}</option>`).join('')}</select>
   <label class="row sm" style="margin-top:8px"><input type="checkbox" id="pk" style="width:auto" ${S.set.peek?'checked':''}> Allow viewing note before answering</label>
   <div class="row" style="margin-top:8px"><button class="p grow" onclick="saveSet()">Save</button><button class="grow" onclick="testKey()">Test</button></div></div>
  <div class="card"><div class="b" style="margin-bottom:6px">Your data</div>
   <div class="xs mut" style="margin-bottom:8px">Progress auto-saves in this browser. Export a backup regularly (also to move between devices).</div>
   <div class="row"><button class="grow" onclick="exp()">Export</button><button class="grow" onclick="$('#f').click()">Import</button><input id="f" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div>
   <button style="width:100%;margin-top:8px;color:var(--no)" onclick="if(confirm('Erase ALL progress, bookmarks and chat?')){const k=S.set;S=def();S.set=k;save();render()}">Reset progress</button></div>
  <div class="card"><div class="row sp" style="margin-bottom:6px"><span class="b">Repeated questions</span><span class="xs mut">${DATA.filter(q=>!q.canonical).length+S.manualDup.length} hidden by default</span></div>
   <div class="xs mut" style="margin-bottom:8px">Auto-detected repeats are hidden whenever "Hide repeated questions" is on in Practice. You can also flag any question yourself while practicing (🔁 on its action row) — it's remembered here.</div>
   ${S.manualDup.length?S.manualDup.map(id=>{const q=BY[id];return q?`<div class="row sp sm" style="padding:6px 0;border-top:1px solid var(--bd)"><span>${esc(q.q.slice(0,70))}${q.q.length>70?'…':''}</span><button class="g xs" onclick="toggleDup('${id}');render()">unflag</button></div>`:''}).join(''):'<div class="xs mut">No manually flagged questions yet.</div>'}
  </div>
  <div class="card xs mut">Placeholder data: ${DATA.length} questions. AI-derived keys are stored only in this browser and labelled unverified.</div>`;
}
function saveSet(){S.set.key=$('#k').value.trim();S.set.model=$('#m').value.trim()||DEF_MODEL;S.set.ahead=+$('#ah').value;S.set.peek=$('#pk').checked;perr='';PQ.length=0;save();toast('Saved')}
async function testKey(){saveSet();try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.set.model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.set.key},body:JSON.stringify({contents:[{role:'user',parts:[{text:'Reply: ok'}]}]})});const j=await r.json();toast(r.ok?'✓ Key works':'✗ '+(j.error?.message||r.status).slice(0,80))}catch(e){toast('✗ '+e.message)}}
function exp(){const b=new Blob([JSON.stringify({...S,set:{...S.set,key:''}},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bsqb-backup-'+day(Date.now())+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),k=S.set.key;S=Object.assign(def(),j);S.set.key=k;save();toast('Imported');render()}catch(e){toast('Invalid file')}};r.readAsText(f)}

/* keys */
document.addEventListener('keydown',e=>{
  if(tab!=='practice'||!S.cur||S.cur.i>=S.cur.ids.length||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const q=BY[S.cur.ids[S.cur.i]],done=S.cur.res[q.id]!==undefined,k=e.key.toUpperCase();
  if(e.key==='ArrowRight'||(done&&e.key==='Enter'))nav(1);else if(e.key==='ArrowLeft')nav(-1);
  else if(!done&&q.opts.some(o=>o[0]===k))pick(k);
});
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(tab!=='practice'||!curQ()||e.target.closest('.strip,table,pre,#side,textarea'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>80&&Math.abs(dy)<50)nav(dx<0?1:-1);
},{passive:true});
render();
</script>
